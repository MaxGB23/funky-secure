name: ci

# The pinned actions are refreshed by hand, because this repository has no Dependabot and a pin nobody
# bumps rots into a vulnerable one. For each action: read the current tag, resolve it to a commit, then
# edit the SHA and its trailing version comment together, here and in release.yml.
#
#   curl -sS https://api.github.com/repos/<owner>/<repo>/releases/latest | grep tag_name
#   curl -sS https://api.github.com/repos/<owner>/<repo>/commits/<tag> | grep -m1 '"sha"'
#
# Runner labels are exact on purpose (RFC 15.4): the label pins the image major, not its patches, so an
# operating-system migration cannot turn a green suite red on the vendor's schedule.

on:
  push:
    branches: [main]
  # `labeled` and `edited` matter: the policy reads the labels and the body, and both can change
  # after the pull request exists. `ready_for_review` matters for the same reason: the policy job is
  # guarded on a draft, so the run that decides is the one that fires when the draft becomes ready.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    # Windows is not decoration: the pnpm shim expansion, the .cmd spawn rules and the release guard's
    # npm invocation are Windows-only paths (E7, I-11). The matrix runs the declared engines floor and
    # the Active LTS, so the support claim is executed rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm is set up for the self-scan, not for a dependency install: the package has none, and
      # without an answering pnpm `package-manager-pin` would degrade to a silent skip in CI.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: node --test
      - name: self-scan
        run: node bin/funky-secure.js scan --scope repo --fail-on warn

  test-macos:
    # A third platform, and the only leg the product does not branch on: `macos-26` is the arm64 image
    # (`macos-26-intel` is Intel), so this runs the POSIX path Ubuntu already exercises on a processor
    # nobody here has. Exact label, never `-latest`. Blocking on purpose: the delivery gate reads a
    # job's conclusion (`scripts/wait-for-ci.js`), so a leg that could fail without blocking would be
    # an experiment wearing a gate's clothes.
    # The id stays `test-macos`: the record and the gate read the id, never the rendered check name.
    # Spelled out because a job outside the matrix is displayed by its id alone, so this leg would
    # otherwise sit in the pull request's list next to `test (ubuntu-24.04, 22)` as a bare `test-macos`.
    name: test-macos (macos-26 arm64, node 24)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Twelve cases guard on pnpm answering, and a guarded case measures nothing. The version is
      # printed so the log names the tool that answered; the pin is the version, so a different one is
      # the action's bug and not a second place to restate it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: pnpm answers
        run: pnpm --version
      # `bash -e` is the shell this step runs under: `|| status=$?` keeps the log readable before the
      # step fails, and the exit code still decides.
      - name: Run the test suite
        run: |
          node --test > suite.log 2>&1 || status=$?
          cat suite.log
          exit ${status:-0}
      # The floor catches a leg that ran nothing; the skip text catches the twelve pnpm-gated cases,
      # which still count in `tests` and would otherwise be invisible. `skipped 0` is not the guard:
      # `tests/plan-spelling.test.js` skips on every non-Windows host by design.
      - name: The leg ran the suite it claims
        run: |
          grep -qx 'ℹ fail 0' suite.log
          if grep -q 'pnpm did not answer' suite.log; then
            echo 'a pnpm-gated case skipped although pnpm answers'
            exit 1
          fi
          node -e 'const m=/^ℹ tests (\d+)$/m.exec(require("node:fs").readFileSync("suite.log","utf8")); if(!m||Number(m[1])<1000){console.error("the suite reported "+(m?m[1]:"no total"));process.exit(1)}'

  pr-policy:
    # A draft is not a candidate yet: the policy judges a pull request that may merge, so the job skips a
    # draft and `ready_for_review` is what fires the run that decides.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      # The event payload carries the labels as they were when the event fired, which is before the label
      # is queryable. Measured on #233: the `opened` run read them empty and reported a failure nobody
      # caused, while the `labeled` run of the same commit read them filled. A guard on a draft used to
      # hide that, and a pull request that is ready from birth has no such guard, so this job resolves
      # them itself. A read that fails fails the job: a policy that cannot see the labels must never
      # answer as if the pull request had none.
      - name: the labels the pull request has now
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          names=$(timeout 60 gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: pull request policy
        run: node scripts/check-pr-policy.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ steps.labels.outputs.names }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

  runtime-claims:
    # Three claims `docs/validation.md` used to leave to a static reading, measured on one runner. The
    # guard is per step and not per job: only the 403 question depends on the token's context, and the
    # other two touch no token, so they keep running on a fork pull request, where the permission answer
    # belongs to the platform.
    runs-on: ubuntu-24.04
    # A stalled connection would otherwise hold the job open for the runner's default maximum.
    timeout-minutes: 15
    # Declared here and not inherited: the claim this job measures is about this declaration, so a
    # reviewer reads it in the job rather than two screens above it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      # The remediation probe runs pnpm itself, so the job asks for the version this repository pins
      # instead of measuring whichever pnpm the image carries — or none at all. `run_install` is off
      # because there is nothing to install: the probe's own directories declare no dependencies.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - name: which context this job measured
        run: |
          set -eu
          echo "event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "measured: a push to the default branch"
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "measured: a pull request from a branch of this repository"
          else
            echo "not measured: a pull request from a fork, whose token is read-only whatever the job declares"
          fi
      # The guard sits on this step, not on the job: a fork pull request gets a read-only token whatever
      # the job declares, so a green here would measure the platform's rule. The print above says so,
      # which is what makes the skip legible instead of looking like a disabled job.
      - name: "the 403 for a contents: read token"
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/probe-permissions.js
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The row `docs/validation.md` carried as "the tarball was installed and exercised locally only":
      # `files` decides what survives packing, and every mistake there fails at the one place the suite
      # cannot see — the package installs and does not start.
      - name: the packed artifact installs and answers
        run: node scripts/pack-smoke.js
      # The row "the commands were verified for shape, not for effect": both shapes the catalogue emits
      # run here, in a scratch directory, and are judged by what they left behind.
      - name: the remediation commands take effect
        run: node scripts/probe-remediation.js

  runtime-claims-windows:
    # The pin is quoted for `cmd`, `bash` and `sh` (0042), and the defect that opened this was reported
    # from the shell Windows opens by default. On the job above every printed command is executed by
    # `sh`, the one family that always read the old spelling, so a green there said nothing about the
    # reader whose paste failed. Same probe, same pinned pnpm, `cmd` instead of `sh`.
    runs-on: windows-2025
    # A stalled network would otherwise hold the job open for the runner's default maximum.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The probe runs pnpm itself, so the job asks for the version this repository pins instead of
      # measuring whichever pnpm the image carries. `run_install` is off: its fixture directories
      # declare no dependencies.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: the remediation commands take effect under cmd
        run: node scripts/probe-remediation.js
