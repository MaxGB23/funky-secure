name: ci

# The pinned actions are refreshed by hand, because this repository has no Dependabot and a pin nobody
# bumps rots into a vulnerable one. For each action: read the current tag, resolve it to a commit, then
# edit the SHA and its trailing version comment together, here and in release.yml.
#
#   curl -sS https://api.github.com/repos/<owner>/<repo>/releases/latest | grep tag_name
#   curl -sS https://api.github.com/repos/<owner>/<repo>/commits/<tag> | grep -m1 '"sha"'
#
# Runner labels are exact on purpose (RFC 15.4): the label pins the image major, not its patches, so an
# operating-system migration cannot turn a green suite red on the vendor's schedule.

on:
  push:
    branches: [main]
  # `labeled` and `edited` matter: the policy reads the labels and the body, and both can change
  # after the pull request exists.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  test:
    # Windows is not decoration: the pnpm shim expansion, the .cmd spawn rules and the release guard's
    # npm invocation are Windows-only paths (E7, I-11). The matrix runs the declared engines floor and
    # the Active LTS, so the support claim is executed rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm is set up for the self-scan, not for a dependency install: the package has none, and
      # without an answering pnpm `package-manager-pin` would degrade to a silent skip in CI.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: node --test
      - name: self-scan
        run: node bin/funky-secure.js scan --scope repo --fail-on warn

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: pull request policy
        run: node scripts/check-pr-policy.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
