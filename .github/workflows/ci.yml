name: ci

on:
  push:
    branches: [main]
  # `labeled` and `edited` matter: the policy reads the labels and the body, and both can change
  # after the pull request exists.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  test:
    # Windows is not decoration: the pnpm shim expansion, the .cmd spawn rules and the release guard's
    # npm invocation are Windows-only paths (E7, I-11). The floor is the engines.node value, so the
    # declared support is tested instead of assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.11, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - name: self-scan
        run: node bin/funky-secure.js scan --scope repo --fail-on warn

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: pull request policy
        run: node scripts/check-pr-policy.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
