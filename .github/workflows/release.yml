name: release

# Publication is reachable only from a version tag (RFC 17.3). Never add `pull_request` or a branch
# to this trigger: a pull request that can reach the publish job is the defect this workflow exists
# to prevent. `tests/release-workflow.test.js` asserts that shape.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm answers the self-scan inside prepublishOnly; there is no dependency to install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - name: the tag must name the package version
        run: node scripts/release-guard.js --tag "$GITHUB_REF_NAME"
      # `npm publish` runs `prepublishOnly` first: the suite, the drift gate, the self-scan and the
      # packed-file check. There is no flag that skips it and no long-lived token to publish with.
      - name: publish with provenance over trusted publishing
        run: npm publish --provenance --access public
