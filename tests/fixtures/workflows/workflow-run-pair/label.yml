name: label
on:
  workflow_run:
    workflows: ["pr build"]
    types: [completed]
permissions: { contents: write, actions: read, pull-requests: write }
jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@65a9edc1b2d3e4f5061728394a5b6c7d8e9f0a1b # v5.0.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: gh pr comment ${{ github.event.workflow_run.pull_requests[0].number }} -F out.txt
        env: { GH_TOKEN: ${{ github.token }} }
